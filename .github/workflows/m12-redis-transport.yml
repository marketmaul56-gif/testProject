name: M12 Redis Authority Transport

on:
  push:
    branches: [main, 'm12/**']
  pull_request:

permissions:
  contents: read

jobs:
  bullmq-authority-transport:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.4.0'
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: BullMQ / Redis delivery integration
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: node --test tests/integration/bullmq-authority-transport.test.ts
