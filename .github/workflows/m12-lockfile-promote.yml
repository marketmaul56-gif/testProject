name: One-time M12.9 ioredis Lockfile Promote

on:
  push:
    branches: ['m12/implementation-foundation']

permissions:
  contents: write

jobs:
  promote-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m12/implementation-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.4.0'
      - name: Generate reviewed lock state
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already current.'
            exit 0
          fi
          test -z "$(git status --porcelain | grep -v '^ M pnpm-lock.yaml$' || true)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m 'chore: lock ioredis dependency'
          git push origin HEAD:m12/implementation-foundation
