name: M12 CI

on:
  push:
    branches: [main, 'm12/**']
  pull_request:

permissions:
  contents: read

jobs:
  domain-architecture-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.4.0'
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Architecture checks
        run: pnpm run check:architecture
      - name: Static type check
        run: pnpm run typecheck
      - name: Domain invariant tests
        run: pnpm run test:domain
      - name: Negative authorization and input-security tests
        run: pnpm run test:security
      - name: Prisma schema validation
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skill_platform
        run: pnpm run db:validate

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skill_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skill_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply all version-controlled migrations in deterministic order
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            echo "Applying ${migration}"
            psql -h localhost -U postgres -d skill_platform -v ON_ERROR_STOP=1 -f "${migration}"
          done < <(find prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql -print | sort)
      - name: Verify authority, authorization, auth and audit constraints exist
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d skill_platform -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgname = 'skill_evidence_requires_pass') THEN
              RAISE EXCEPTION 'missing skill_evidence_requires_pass trigger';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgname = 'course_versions_immutable_after_publish') THEN
              RAISE EXCEPTION 'missing course version immutability trigger';
            END IF;
            IF to_regclass('public.member_roles') IS NULL THEN
              RAISE EXCEPTION 'missing application authorization roles';
            END IF;
            IF to_regclass('public.audit_events') IS NULL THEN
              RAISE EXCEPTION 'missing audit event store';
            END IF;
            IF to_regclass('auth."user"') IS NULL THEN
              RAISE EXCEPTION 'missing Better Auth user table';
            END IF;
            IF to_regclass('auth.session') IS NULL THEN
              RAISE EXCEPTION 'missing Better Auth session table';
            END IF;
            IF to_regclass('auth."twoFactor"') IS NULL THEN
              RAISE EXCEPTION 'missing Better Auth TOTP table';
            END IF;
          END $$;
          SQL
