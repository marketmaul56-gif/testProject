name: One-time M12.3 Lockfile Promote

on:
  push:
    branches: ['m12/implementation-foundation']
    paths: ['.github/workflows/lockfile-promote-m12-3.yml']

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m12/implementation-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.4.0'
      - name: Generate dependency lock state
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'chore: lock M12.3 dependencies'
          git push origin HEAD:m12/implementation-foundation
